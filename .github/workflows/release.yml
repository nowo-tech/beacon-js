name: Release

# Runs by hand only, and is a dry run unless both `dry_run` is false and the repository variable NPM_PUBLISH_ENABLED
# is 'true'. It builds, packs, builds the release assets (delivery files, golden envelope tarball, checksums) and
# uploads them as workflow artifacts. Publishing authenticates with the optional `NPM_TOKEN` secret of the
# `npm-publish` environment (first publish only: trusted publishing needs the packages to exist), and otherwise with
# npm trusted publishing (OIDC). See "Releasing" in CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nothing is published). Publishing also needs vars.NPM_PUBLISH_ENABLED == true.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    # Only from main or a v* tag (FV-L5): a dispatch from any other ref skips the job entirely.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:check
      - name: Golden set regenerates byte for byte and passes the mock server
        run: |
          pnpm golden:check
          pnpm test:mock
      - name: Release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp packages/browser/dist/delivery/* release-assets/
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C fixtures/envelopes/golden -czf release-assets/golden-envelopes.tar.gz .
          cd release-assets
          sha256sum golden-envelopes.tar.gz > golden-envelopes.tar.gz.sha256
          sha256sum beacon.min.js beacon.min.js.map beacon.esm.min.js beacon.esm.min.js.map golden-envelopes.tar.gz > SHA256SUMS
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
      - name: Pack the packages (workspace versions resolved), in dependency order
        run: |
          set -euo pipefail
          mkdir -p npm-tarballs
          for pkg in core browser node express; do
            (cd "packages/$pkg" && pnpm pack --pack-destination ../../npm-tarballs)
          done
          ls -la npm-tarballs
      - name: Publish (dry run)
        run: |
          set -euo pipefail
          for pkg in core browser node express; do
            npx -y npm@11.21.2 publish --dry-run --access public npm-tarballs/nowo-tech-beacon-$pkg-*.tgz
          done
      - name: Publish to npm (token for the first publish, otherwise trusted publishing)
        if: ${{ !inputs.dry_run && vars.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN}" ]; then
            echo "Authenticating with the NPM_TOKEN secret of the npm-publish environment (bootstrap)."
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${RUNNER_TEMP}/.npmrc"
          else
            echo "No NPM_TOKEN: npm trusted publishing (OIDC)."
            : > "${RUNNER_TEMP}/.npmrc"
          fi
          export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          # npm >= 11.5 does trusted publishing from GitHub Actions; --provenance in both modes.
          for pkg in core browser node express; do
            npx -y npm@11.21.2 publish --provenance --access public npm-tarballs/nowo-tech-beacon-$pkg-*.tgz
          done
          rm -f "${RUNNER_TEMP}/.npmrc"
