name: Release

# Pushing a v* tag (e.g. v0.2.0) publishes; running it by hand is a dry run unless `dry_run` is false and it runs from
# a v* tag. Three jobs:
# - `build` installs, builds, checks and packs. On a tag it also checks that every package version equals the tag.
#   It has no npm credential and no `id-token: write`.
# - `publish` (tags only, and only when the repository variable NPM_PUBLISH_ENABLED is 'true') downloads the packed
#   tarballs, runs no `pnpm install` and no dependency code, and is the only job with `id-token: write` and the
#   `npm-publish` environment (npm trusted publishing, OIDC only: the environment has no secrets). Versions already on npm are skipped,
#   so a failed run can be re-run.
# - `github-release` (tags only, after publish) creates the GitHub release with the browser bundles and checksums.
# See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (nothing is published). Publishing by hand also needs a v* tag ref and vars.NPM_PUBLISH_ENABLED == true.'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # npm >= 11.5 does trusted publishing (OIDC) from GitHub Actions. The publish job uses the npm bundled with Node 24
  # (no global npm install: nothing is fetched outside the pinned setup-node) and fails if it is older.
  NPM_MIN_VERSION: 11.5.0

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Package versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          for pkg in core browser node express; do
            got=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$got" != "$want" ]; then
              echo "::error::packages/$pkg is $got but the tag is $TAG"; exit 1
            fi
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:check
      - name: Golden set regenerates byte for byte and passes the mock server
        run: |
          pnpm golden:check
          pnpm test:mock
      - name: Release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp packages/browser/dist/delivery/* release-assets/
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C fixtures/envelopes/golden -czf release-assets/golden-envelopes.tar.gz .
          cd release-assets
          sha256sum golden-envelopes.tar.gz > golden-envelopes.tar.gz.sha256
          sha256sum beacon.min.js beacon.min.js.map beacon.esm.min.js beacon.esm.min.js.map golden-envelopes.tar.gz > SHA256SUMS
          ls -la
      - name: Pack the packages (workspace versions resolved)
        run: |
          set -euo pipefail
          mkdir -p npm-tarballs
          for pkg in core browser node express; do
            (cd "packages/$pkg" && pnpm pack --pack-destination ../../npm-tarballs)
          done
          (cd npm-tarballs && sha256sum *.tgz > SHA256SUMS && ls -la)
      - name: Publish (dry run, runner npm, no credentials)
        run: |
          set -euo pipefail
          for pkg in core browser node express; do
          # A leading ./ makes npm treat the argument as a local tarball (without it, `dir/file.tgz` is read as a GitHub repo).
            npm publish --dry-run --access public ./npm-tarballs/nowo-tech-beacon-$pkg-*.tgz
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: npm-tarballs/

  publish:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: npm-tarballs
      - name: Verify the tarballs from the build job
        working-directory: npm-tarballs
        run: sha256sum -c SHA256SUMS
      - name: Check the bundled npm supports trusted publishing
        run: |
          v=$(npm --version); echo "npm $v"
          [ "$(printf '%s\n' "$NPM_MIN_VERSION" "$v" | sort -V | head -1)" = "$NPM_MIN_VERSION" ] || { echo "npm $v < $NPM_MIN_VERSION"; exit 1; }
      - name: Publish to npm (trusted publishing, OIDC)
        run: |
          set -euo pipefail
          # No token anywhere: an empty user config, so only the OIDC exchange of npm >= 11.5 can authenticate.
          : > "${RUNNER_TEMP}/.npmrc"
          export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          trap 'rm -f "${RUNNER_TEMP}/.npmrc"' EXIT
          for pkg in core browser node express; do
            tgz=$(ls ./npm-tarballs/nowo-tech-beacon-$pkg-*.tgz)
            ver="${tgz##*-}"; ver="${ver%.tgz}"
            if npm view "@nowo-tech/beacon-$pkg@$ver" version >/dev/null 2>&1; then
              echo "@nowo-tech/beacon-$pkg@$ver is already on npm: skipped."
              continue
            fi
            npm publish --provenance --access public "$tgz"
          done

  github-release:
    needs: publish
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Create the GitHub release (skipped if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists: skipped."
          else
            gh release create "$TAG" -R "$REPO" --verify-tag --generate-notes release-assets/*
          fi
